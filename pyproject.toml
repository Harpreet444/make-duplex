[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "make-duplex"
version = "0.1.0"
description = "Correct N-up manual duplex printing for single-sided printers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "pymupdf>=1.23.0",
]

[project.scripts]
make-duplex = "make_duplex.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
